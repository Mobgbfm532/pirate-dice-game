<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a0f08">
    <title>2, 4, 24</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* The loading screen (visuals plan step 4, 25 Oct): the tavern, the title and a die
           tumbling while the game downloads; main.tsx fades it out once the table is drawn. */
        #boot {
            position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            background: radial-gradient(ellipse 80% 70% at 50% 45%, rgba(18, 10, 4, 0.35), rgba(8, 4, 2, 0.92)),
                url('%BASE_URL%art/tavern.webp') center / cover, #120a05;
            color: #f3e6c8; font-family: 'Almendra', Georgia, serif; transition: opacity 0.6s;
        }
        #boot.gone { opacity: 0; pointer-events: none; }
        #boot h1 { margin: 0; font-size: clamp(2.6rem, 12vw, 4rem); color: #ffd54f; text-shadow: 0 3px 0 #5a3a08, 0 0 24px rgba(255, 190, 80, 0.55); }
        #boot p { margin: 0; font-size: 1.05rem; color: #cbb994; text-shadow: 0 1px 4px #000; }
        #boot .die {
            width: 56px; height: 56px; border-radius: 12px; position: relative;
            background: radial-gradient(circle at 35% 30%, #fffdf4, #eadfc4 70%, #cdbb92);
            box-shadow: inset 0 -4px 6px rgba(90, 60, 20, 0.35), 0 8px 16px rgba(0, 0, 0, 0.6);
            animation: boot-tumble 1.4s cubic-bezier(0.45, 0, 0.3, 1) infinite;
        }
        #boot .die i { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #2e7d32; }
        @keyframes boot-tumble {
            0% { transform: translateY(0) rotate(0deg); }
            35% { transform: translateY(-26px) rotate(160deg); }
            60% { transform: translateY(0) rotate(270deg) scaleY(0.92); }
            75% { transform: translateY(-6px) rotate(330deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="boot" aria-label="Loading">
        <h1>2, 4, 24</h1>
        <div class="die" aria-hidden="true">
            <i style="left:10px;top:9px"></i><i style="right:10px;top:9px"></i>
            <i style="left:10px;top:22px"></i><i style="right:10px;top:22px"></i>
            <i style="left:10px;bottom:9px"></i><i style="right:10px;bottom:9px"></i>
        </div>
        <p>Setting up the table…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
